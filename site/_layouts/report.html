---
layout: default
bodyClass: "page-report"
---
<header class="page-header">
  <div class="container">
    <p class="eyebrow"><a href="{{ '/genomics/reports/' | relative_url }}">Genomic Surveillance Reports</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  </div>
</header>
<div class="container section">
  {% if content != "" %}<div class="row"><div class="col-12 col-lg-9"><div class="content mb-4">{{ content }}</div></div></div>{% endif %}
  <iframe class="report-frame"{% if page.height %} style="height: {{ page.height }}px"{% endif %} src="{{ page.file | relative_url }}" title="{{ page.title }} (interactive figure)" loading="lazy"></iframe>
  <p class="caption"><a href="{{ page.file | relative_url }}" target="_blank" rel="noopener">Open the report in a new tab</a></p>
</div>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="{{ '/images/shl/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link href="{{ '/assets/css/style.css' | relative_url }}" rel="stylesheet">
  <meta name="description" content="{{ page.description | default: site.description | strip }}" />
  <meta property="og:title" content="{{ page.meta_title | default: page.title }}"/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="{{ page.url | absolute_url }}"/>
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}"/>{% endif %}
  <meta property="og:description" content="{{ page.description | default: site.description | strip }}"/>
  <meta name="twitter:card" content="summary"/>
</head>

<body class='page {{ layout.bodyClass }}'>
  {% include main-menu-mobile.html %}
  {% include header.html %}
  <main id="wrapper" class="wrapper">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/scripts.js' | relative_url }}"></script>
</body>
</html>

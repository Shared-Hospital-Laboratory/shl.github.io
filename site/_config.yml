baseurl: ''
permalink: pretty

# News posts live in _posts/ and are served at /news/YEAR/slug/
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /news/:year/:title/
  - scope:
      path: ""
      type: "reports"
    values:
      layout: "report"
title: 'Shared Hospital Laboratory'
description: >-
  Shared Hospital Laboratory (SHL) is the largest hospital-based microbiology
  lab in Ontario, a collaboration between Scarborough Health Network, North York
  General Hospital, Michael Garron Hospital and Sunnybrook Health Sciences Centre.

logo:
  mobile: "images/shl/logo.png"
  mobile_height: "40px"
  mobile_width: "79px"
  desktop: "images/shl/logo.png"
  desktop_height: "48px"
  desktop_width: "95px"

collections:
  team:
    output: false
  reports:
    output: true
    permalink: /genomics/reports/:name/

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - reports/README.md
  - LICENSE
  - README.md
  - netlify.toml

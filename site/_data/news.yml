- title: "Dr. Samira Mubareka named Applied Public Health Chair"
  body: "Infectious disease physician, medical microbiologist and scientist at Sunnybrook, has received an Applied Public Health Chair, co-funded by the Canadian Institutes of Health Research (CIHR) and the Public Health Agency of Canada (PHAC)."
  image: "images/shl/samira-mubareka-lab.jpg"
  image_alt: "Dr. Samira Mubareka at a microscope in her lab"
  link: "https://sunnybrook.ca/media/item.asp?c=2&i=3696&f=samira-mubareka-named-applied-public-health-chair"

- title: "Finlay Maguire"
  subtitle: "Royal Society of Canada | Class of 2025"
  body: "Is an Assistant Professor at Dalhousie University and Pathogenomics Lead at Toronto's **Shared Hospital Laboratory.** A leading expert in genomic epidemiology and data science, he has significantly contributed to national and international responses to public health emergencies including SARS-CoV-2, avian influenza and antimicrobial resistance. Through his research and leadership in multinational capacity-building, he translates genomic insights into real-world clinical decision-making and public health practice on a global scale."
  image: "images/shl/finlay-rsc.jpg"
  image_alt: "Royal Society of Canada Class of 2025 announcement card for Finlay Maguire"
  youtube: "RWYT-EYnZYg"
  youtube_title: "About Dr. Finlay Maguire"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SARS-CoV-2 lineages (placeholder)</title>
<script src="../assets/js/vendor/plotly.min.js"></script>
<style>
  html, body { margin: 0; font-family: "Source Sans 3", system-ui, sans-serif; color: #1b2333; background: #fff; }
  .note { margin: 12px 16px 0; padding: 8px 12px; background: #fff4d6; border-left: 4px solid #e0a800; font-size: 14px; }
  .plot { width: 100%; height: 440px; }
</style>
</head>
<body>
<p class="note">Placeholder report: the numbers below are synthetic and for layout testing only.</p>
<div id="share" class="plot"></div>
<div id="counts" class="plot"></div>
<script>
  // Synthetic weekly sequence counts for four lineage groups that rise and fall in turn.
  var weeks = [], lineages = ["Lineage A", "Lineage B", "Lineage C", "Lineage D"], counts = {};
  lineages.forEach(function (l) { counts[l] = []; });
  for (var w = 0; w < 26; w++) {
    var d = new Date(Date.UTC(2025, 6, 7 + 7 * w));
    weeks.push(d.toISOString().slice(0, 10));
    lineages.forEach(function (l, i) {
      var peak = 2 + i * 7, spread = 5;
      counts[l].push(Math.round(30 * Math.exp(-Math.pow((w - peak) / spread, 2)) + 2));
    });
  }
  var colors = ["#1f47c2", "#3366ff", "#7fa0ff", "#9aa3b2"];
  var base = { margin: { t: 48, r: 16, b: 48, l: 56 },
    font: { family: "Source Sans 3, system-ui, sans-serif", color: "#1b2333" },
    legend: { orientation: "h", y: -0.18 } };
  var cfg = { responsive: true, displaylogo: false };

  Plotly.newPlot("share", lineages.map(function (l, i) {
    return { type: "scatter", mode: "lines", stackgroup: "one", groupnorm: "percent",
             name: l, x: weeks, y: counts[l], line: { width: 0.5, color: colors[i] } };
  }), Object.assign({}, base, { title: "Share of sequenced samples by lineage, weekly",
    yaxis: { title: "% of sequences", range: [0, 100] } }), cfg);

  var totals = weeks.map(function (_, w) { return lineages.reduce(function (s, l) { return s + counts[l][w]; }, 0); });
  Plotly.newPlot("counts", [{ type: "bar", x: weeks, y: totals, marker: { color: "#3366ff" }, name: "Sequences" }],
    Object.assign({}, base, { title: "Genomes sequenced per week", yaxis: { title: "Sequences" } }), cfg);
</script>
</body>
</html>

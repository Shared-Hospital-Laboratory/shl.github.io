<article class="news-card">
  <a class="news-card-link" href="{{ include.post.url | relative_url }}">
    {% if include.post.image %}<div class="news-card-image"><img src="{{ include.post.image | relative_url }}" alt="" loading="lazy" /></div>{% endif %}
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%B %Y" }}</time>
    <h3>{{ include.post.title }}</h3>
    <p>{{ include.post.summary }}</p>
  </a>
</article>
